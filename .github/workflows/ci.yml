name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_COOKIE_NAME: chillmeAuthToken
      NEXT_PUBLIC_FIREBASE_APIKEY: REDACTED_BY_HISTORY_PURGE
      NEXT_PUBLIC_FIREBASE_AUTHDOMAIN: chilldotme.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECTID: chilldotme
      NEXT_PUBLIC_FIREBASE_STORAGEBUCKET: chilldotme.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID: 797844069108
      NEXT_PUBLIC_FIREBASE_APPID: REDACTED_BY_HISTORY_PURGE
      NEXT_PUBLIC_FIREBASE_MEASUREMENTID: REDACTED_BY_HISTORY_PURGE
      NEXT_PUBLIC_LIVEKIT_URL: wss://chillmeapp-3ql6lsn7.livekit.cloud
      NEXT_PUBLIC_STRIPE_PRODUCT_NAME: chillme_demo_credits
      NEXT_PUBLIC_CREDITS_PER_IMAGE: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run tslint
      - run: npm test
      - run: npm run build
